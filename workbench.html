<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cidade Viva — Bancada 3D de Revisão Visual</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #141922; color: #eef2f7;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #ui {
      position: fixed; top: 12px; left: 12px; z-index: 10;
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: rgba(14, 18, 26, 0.86); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(8px);
      font-size: 12px;
    }
    #ui select, #ui button {
      background: rgba(255,255,255,0.08); color: #eef2f7;
      border: 1px solid rgba(255,255,255,0.16); border-radius: 6px;
      padding: 4px 8px; font-size: 12px; cursor: pointer;
    }
    #ui button.active { background: #3b82f6; border-color: #60a5fa; color: #fff; }
    #metrics {
      position: fixed; bottom: 12px; left: 12px; z-index: 10;
      background: rgba(14, 18, 26, 0.86); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px; padding: 6px 12px; font-family: ui-monospace, monospace; font-size: 12px;
    }
    #overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 20;
    }
    .sheet-cell-label {
      position: absolute; padding: 4px 9px; border-radius: 5px;
      background: rgba(10, 14, 20, 0.78); border: 1px solid rgba(255,255,255,0.16);
      font-size: 12px; font-weight: 600; color: #f1f5f9; letter-spacing: 0.02em;
    }
    .sheet-banner {
      position: absolute; left: 0; right: 0; top: 0; height: 34px;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px; background: rgba(10, 14, 20, 0.92);
      border-bottom: 1px solid rgba(255,255,255,0.15);
      font-size: 13px; font-family: ui-monospace, monospace; color: #e2e8f0;
    }
    .sheet-divider-h { position: absolute; left: 0; right: 0; height: 1px; background: rgba(255,255,255,0.18); }
    .sheet-divider-v { position: absolute; top: 34px; bottom: 0; width: 1px; background: rgba(255,255,255,0.18); }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <div id="metrics"></div>
  <div id="overlay"></div>
  <script type="module" src="/src/workbench/main.ts"></script>
</body>
</html>
